<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#C6FF00" />
  <title>Finance App — Beranda</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <header class="app-header">
    <h1>Finance</h1>
    <div class="header-actions">
      <button id="btn-add-tx" class="btn btn-sm btn-primary" title="Tambah transaksi">+ Transaksi</button>
      <a href="pengaturan.html" class="icon-btn" title="Pengaturan" aria-label="Pengaturan">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="12" cy="12" r="3"/>
          <path d="M19.4 15a1.65 1.65 0 00.33 1.82l.06.06a2 2 0 11-2.83 2.83l-.06-.06a1.65 1.65 0 00-1.82-.33 1.65 1.65 0 00-1 1.51V21a2 2 0 01-4 0v-.09A1.65 1.65 0 009 19.4a1.65 1.65 0 00-1.82.33l-.06.06a2 2 0 11-2.83-2.83l.06-.06A1.65 1.65 0 004.6 15a1.65 1.65 0 00-1.51-1H3a2 2 0 010-4h.09A1.65 1.65 0 004.6 9a1.65 1.65 0 00-.33-1.82l-.06-.06a2 2 0 112.83-2.83l.06.06A1.65 1.65 0 009 4.6a1.65 1.65 0 001-1.51V3a2 2 0 014 0v.09a1.65 1.65 0 001 1.51 1.65 1.65 0 001.82-.33l.06-.06a2 2 0 112.83 2.83l-.06.06A1.65 1.65 0 0019.4 9a1.65 1.65 0 001.51 1H21a2 2 0 010 4h-.09a1.65 1.65 0 00-1.51 1z"/>
        </svg>
      </a>
      <button id="btn-logout" class="btn btn-sm btn-outline" title="Logout">Keluar</button>
    </div>
  </header>

  <main class="container dashboard-content">
    <!-- Balance -->
    <div class="balance-card">
      <div class="balance-label">Saldo Kas Saat Ini</div>
      <div class="balance-amount" id="balance">Rp 0</div>
    </div>

    <!-- Stats -->
    <div class="stats-grid">
      <div class="stat-card income">
        <div class="label">Pemasukan</div>
        <div class="value" id="total-income">Rp 0</div>
      </div>
      <div class="stat-card expense">
        <div class="label">Pengeluaran</div>
        <div class="value" id="total-expense">Rp 0</div>
      </div>
      <div class="stat-card">
        <div class="label">Transaksi</div>
        <div class="value" id="tx-count">0</div>
      </div>
      <div class="stat-card">
        <div class="label">Anggota Aktif</div>
        <div class="value" id="member-count">0</div>
      </div>
    </div>

    <!-- Iuran hari ini -->
    <div class="section-title">
      <span>Iuran Hari Ini</span>
      <a href="iuran.html" class="badge">Kelola →</a>
    </div>
    <a href="iuran.html" class="iuran-summary" id="iuran-today-card" style="display:block; text-decoration:none; color:inherit;">
      <div class="iuran-summary-top">
        <span class="iuran-summary-count" id="iuran-today-count">0 / 0</span>
        <span class="iuran-summary-total" id="iuran-today-total">Rp 0 terkumpul</span>
      </div>
      <div class="progress-track">
        <div class="progress-fill" id="iuran-today-progress" style="width:0%"></div>
      </div>
    </a>

    <!-- Recent -->
    <div class="section-title">
      <span>Aktivitas Terbaru</span>
      <a href="riwayat.html" class="badge">Semua →</a>
    </div>
    <div class="tx-list" id="recent-list">
      <div class="skeleton"></div>
      <div class="skeleton"></div>
      <div class="skeleton"></div>
    </div>
  </main>

  <!-- Bottom Navigation -->
  <nav class="bottom-nav">
    <a class="nav-item" data-page="dashboard.html" href="dashboard.html">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
        <path d="M3 9l9-7 9 7v11a2 2 0 01-2 2H5a2 2 0 01-2-2z"/>
        <polyline points="9 22 9 12 15 12 15 22"/>
      </svg>
      <span class="nav-label">Beranda</span>
    </a>
    <a class="nav-item" data-page="iuran.html" href="iuran.html">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
        <rect x="3" y="4" width="18" height="18" rx="2"/>
        <line x1="16" y1="2" x2="16" y2="6"/>
        <line x1="8" y1="2" x2="8" y2="6"/>
        <line x1="3" y1="10" x2="21" y2="10"/>
        <path d="M9 16l2 2 4-4"/>
      </svg>
      <span class="nav-label">Iuran</span>
    </a>
    <a class="nav-item" data-page="riwayat.html" href="riwayat.html">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="12" cy="12" r="10"/>
        <polyline points="12 6 12 12 16 14"/>
      </svg>
      <span class="nav-label">Riwayat</span>
    </a>
    <a class="nav-item" data-page="anggota.html" href="anggota.html">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
        <path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/>
        <circle cx="9" cy="7" r="4"/>
        <path d="M23 21v-2a4 4 0 0 0-3-3.87"/>
        <path d="M16 3.13a4 4 0 0 1 0 7.75"/>
      </svg>
      <span class="nav-label">Anggota</span>
    </a>
  </nav>

  <!-- Modal: Add / Edit Transaction (kas umum) -->
  <div class="overlay" id="modal-overlay">
    <div class="modal">
      <div class="modal-header">
        <h2 id="modal-title">Tambah Transaksi</h2>
        <button class="modal-close" id="modal-close" type="button">×</button>
      </div>

      <form id="tx-form">
        <div class="form-group">
          <label for="tx-name">Nama Transaksi</label>
          <input type="text" id="tx-name" class="form-control" placeholder="Contoh: Gaji, Makan siang" required />
        </div>

        <div class="form-row">
          <div class="form-group">
            <label for="tx-date">Tanggal</label>
            <input type="date" id="tx-date" class="form-control" required />
          </div>
          <div class="form-group">
            <label for="tx-amount">Nominal (Rp)</label>
            <input type="number" id="tx-amount" class="form-control" placeholder="0" min="0" step="1" required />
          </div>
        </div>

        <div class="form-row">
          <div class="form-group">
            <label for="tx-type">Jenis</label>
            <select id="tx-type" class="form-control" required>
              <option value="income">Pemasukan</option>
              <option value="expense" selected>Pengeluaran</option>
            </select>
          </div>
          <div class="form-group">
            <label for="tx-category">Kategori</label>
            <select id="tx-category" class="form-control" required>
              <option value="Gaji">Gaji</option>
              <option value="Iuran">Iuran</option>
              <option value="Investasi">Investasi</option>
              <option value="Hadiah">Hadiah</option>
              <option value="Makanan">Makanan</option>
              <option value="Transport">Transport</option>
              <option value="Belanja">Belanja</option>
              <option value="Tagihan">Tagihan</option>
              <option value="Hiburan">Hiburan</option>
              <option value="Kesehatan">Kesehatan</option>
              <option value="Lainnya">Lainnya</option>
            </select>
          </div>
        </div>

        <div class="form-group">
          <label for="tx-note">Catatan (opsional)</label>
          <textarea id="tx-note" class="form-control" placeholder="Catatan tambahan..."></textarea>
        </div>

        <div class="form-group">
          <label for="tx-photo">Foto Bukti (opsional)</label>
          <input type="file" id="tx-photo" class="form-control" accept="image/*" />
          <div class="photo-preview" id="photo-preview">
            <img id="photo-img" alt="Preview" />
          </div>
        </div>

        <button type="submit" id="btn-save" class="btn btn-primary">Simpan</button>
        <button type="button" id="btn-delete" class="btn btn-danger" style="margin-top:10px; display:none">
          Hapus Transaksi
        </button>
      </form>
    </div>
  </div>

  <!-- Toast -->
  <div id="toast" class="toast"></div>

  <!-- Loading -->
  <div id="loading" class="loading-overlay">
    <div class="spinner" style="width:40px;height:40px;border-width:4px"></div>
  </div>

  <script src="js/utils.js"></script>
  <script src="js/calc.js"></script>
  <script src="js/api.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/common.js"></script>
  <script src="js/dashboard.js"></script>
</body>
</html>
